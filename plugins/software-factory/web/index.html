<!doctype html>
<html lang="en" data-theme="solarized-dark" data-scale="100">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#002b36">
<meta name="referrer" content="no-referrer">
<title>Software factory</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="gone" hidden><p id="gone" role="status"></p></div>
<header class="bar">
  <span class="dot" id="dot" aria-hidden="true"></span>
  <a class="brand" href="#">Software factory</a>
  <strong id="state">Connecting…</strong>
  <span class="muted" id="title"></span>
  <span class="spacer"></span>
  <span class="muted small" id="usage"></span>
  <button type="button" class="ghost" id="stop" hidden>Stop</button>
  <button type="button" class="ghost" id="disconnect" hidden>Disconnect</button>
  <button type="button" class="ghost" popovertarget="prefs" aria-label="Appearance" title="Appearance">Aa</button>
</header>

<div id="prefs" class="prefs" popover>
  <fieldset id="theme" class="themes"><legend>Theme</legend></fieldset>
  <label class="size">Text size <span><input type="range" id="scale" min="0" step="1"><output id="scale-value" for="scale"></output></span></label>
</div>

<sf-overview id="overview" class="view"></sf-overview>

<div id="session-view" class="view" hidden>
  <a class="back" href="#">← All sessions</a>
  <sf-session id="session"></sf-session>
</div>

<div class="layout" id="live-view" hidden>
  <main>
    <a class="back" href="#">← All sessions</a>
    <section id="needs" aria-live="polite"></section>
    <ol id="timeline" class="timeline"></ol>
    <p id="empty" class="muted empty">Nothing yet. Type below, or keep working in the terminal: both show here.</p>
  </main>

  <aside>
    <section>
      <h2>Checks</h2>
      <ul id="checks" class="list"></ul>
    </section>
    <section>
      <h2>Agents</h2>
      <ul id="agents" class="list"><li class="muted">None yet.</li></ul>
    </section>
    <sf-intent id="intent" hidden></sf-intent>
  </aside>
</div>

<form id="composer" class="composer" autocomplete="off" hidden>
  <span class="dots" id="working" role="img" aria-label="Claude is working" hidden><i></i><i></i><i></i></span>
  <div class="attachments" id="attachments" hidden></div>
  <textarea id="text" rows="1" placeholder="Type a message and press Enter" aria-label="Message Claude"></textarea>
  <p class="muted small hint" id="hint">Enter sends, Shift+Enter adds a line.</p>
</form>
</body>
</html>
