# Answers @claude in issues, pull requests and reviews. The action starts
# Claude only for people with write access to the repository, and Claude
# works with the Claude GitHub app's token, which can comment and push
# branches; the ruleset on main keeps it from pushing there.
name: Claude

on:
  # These triggers run with the repository's secrets. That's acceptable here
  # because the action checks the commenter's write access before Claude
  # starts, and nothing runs the pull request's code: no step does, and
  # Claude's default tools allow no shell commands beyond git's.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    name: Claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # One answer at a time per issue or pull request: a later mention waits
    # for the running one, and replaces any mention already waiting. The group
    # is set on the job, not the workflow, so a run joins it only when the if
    # above lets the job run. On the workflow, every run for the thread joined
    # it, so a comment without @claude could cancel a waiting mention.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
      pull-requests: read # read the pull request Claude was asked about
      issues: read # read the issue Claude was asked about
      id-token: write # exchange the workflow's identity for the Claude app's token
      actions: read # let Claude read CI results on pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude Code
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only the maintainer's comments, reviews and review comments go into
          # Claude's prompt. Everyone else's are left out, bots' included, such
          # as Claude's own earlier replies and the review workflow's comments.
          # It filters nothing else: the issue's or pull request's title and
          # body reach the prompt whoever wrote them, and on a pull request
          # Claude works in its branch. Names match exactly, case included.
          include_comments_by_actor: bezmoradi
          additional_permissions: |
            actions: read
