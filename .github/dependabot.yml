# Dependabot proposes, once a week, the actions and linters pinned in
# .github/ at releases that have been out for a week or more, one pull
# request per kind. Claude reviews them like any other pull request, using
# CLAUDE_CODE_OAUTH_TOKEN from the repository's Dependabot secrets, the only
# secrets runs Dependabot starts get. The three release archives in
# linters/install.sh aren't covered.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/linters
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-linters:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /.github/linters
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      markdownlint:
        patterns: ["*"]
