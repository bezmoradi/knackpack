<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Software factory</title>
<style>
:root {
  --bg: #ffffff; --side: #f5f5f7; --line: rgba(0,0,0,.09); --text: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6;
  --row: #f5f5f7; --sel: rgba(0,122,255,.12); --accent: #007aff;
  --green: #28a745; --amber: #ff9f0a; --red: #ff3b30; --blue: #007aff; --grey: #8e8e93;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e1e; --side: #252526; --line: rgba(255,255,255,.08); --text: #e8e8ed; --muted: #98989d; --faint: #636366;
    --row: #2a2a2c; --sel: rgba(10,132,255,.22); --accent: #0a84ff;
    --green: #32d74b; --amber: #ffb340; --red: #ff6961; --blue: #0a84ff; --grey: #8e8e93;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color: var(--text); background: var(--bg); display: grid; grid-template-columns: 280px 1fr;
  -webkit-font-smoothing: antialiased;
}
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 16px 10px; }
.brand h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
nav { overflow-y: auto; padding: 4px 8px 12px; flex: 1; }
.group { color: var(--faint); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 12px 8px 4px; }
.item {
  all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; width: 100%;
  padding: 7px 8px; border-radius: 7px; cursor: default; align-items: center;
}
.item:hover { background: var(--line); }
.item[aria-current="true"] { background: var(--sel); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.item .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .when { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.item .sub { grid-column: 2 / 4; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); }
.dot.working { background: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 20%, transparent); }
.dot.waiting { background: var(--amber); }
.dot.yourturn { background: var(--green); }
.dot.failed { background: var(--red); }
.dot.ended { background: transparent; border: 1.5px solid var(--faint); }
main { overflow-y: auto; min-height: 0; }
.head { position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); padding: 16px 28px 14px; z-index: 1; }
.head .row { display: flex; align-items: center; gap: 10px; }
.head h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
.head .path { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--row); color: var(--muted); }
.pill.working { color: var(--blue); } .pill.waiting { color: var(--amber); } .pill.yourturn { color: var(--green); } .pill.failed { color: var(--red); }
.content { padding: 8px 28px 40px; max-width: 920px; }
.banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--amber) 14%, transparent); font-weight: 500; }
.banner.failed { background: color-mix(in srgb, var(--red) 14%, transparent); }
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
/* A chevron that turns down when its section or row is open. */
.chev::before { content: ""; display: inline-block; width: 5px; height: 5px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s; margin: 0 2px 2px 0; }
details[open] > summary .chev::before, details[open] > summary.chev::before { transform: rotate(45deg); }
.sec > summary h3 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 26px 0 8px; display: flex; gap: 8px; align-items: center; }
.sec > summary:hover h3 { color: var(--text); }
.sec h3 .count { color: var(--faint); font-weight: 500; text-transform: none; letter-spacing: 0; }
.list { background: var(--row); border-radius: 10px; overflow: hidden; }
.list > div, .list > details { border-top: 1px solid var(--line); }
.list > :first-child { border-top: 0; }
.list > div, .list > details > summary { padding: 9px 14px 9px 30px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: baseline; position: relative; }
.list > details > summary.chev::before { position: absolute; left: 13px; top: 15px; }
.list > details > summary:hover { background: var(--line); }
/* Long text shows two lines, a note one, until its row is opened. */
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.note.clamp { -webkit-line-clamp: 1; }
details[open] > summary .clamp { display: block; -webkit-line-clamp: none; overflow: visible; }
/* An open row shows its note's full text in the facts below instead. */
details[open] > summary .note { display: none; }
.more { margin: 0; padding: 0 14px 12px 30px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 12px; }
.more dt { color: var(--faint); }
.more dd { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.tools { display: flex; gap: 14px; margin-top: 16px; font-size: 12px; }
.tools button { all: unset; color: var(--accent); cursor: pointer; }
.tools button:hover { text-decoration: underline; }
.tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.list .main { overflow-wrap: anywhere; }
.list .note { grid-column: 2 / 4; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.list .meta { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list .tag { font: 600 10px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); padding: 3px 5px; border-radius: 4px; background: var(--line); }
.ic { width: 14px; text-align: center; font-weight: 700; }
.ic.ok { color: var(--green); } .ic.no { color: var(--red); } .ic.run { color: var(--blue); } .ic.q { color: var(--accent); } .ic.todo { color: var(--faint); }
.answer { color: var(--accent); font-weight: 500; }
.done .main { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin: 2px 0 10px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.empty { color: var(--faint); padding: 9px 14px; background: var(--row); border-radius: 10px; }
.sub2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
.nothing { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 40px; }
.nothing b { color: var(--text); display: block; font-size: 15px; margin-bottom: 6px; }
@media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside><div class="brand"><h1>Software factory</h1><p id="summary"></p></div><nav id="nav" aria-label="Sessions"></nav></aside>
<main id="main"></main>
<!-- knackpack:data -->
<script>
"use strict";
const data = JSON.parse(document.getElementById("data").textContent);
const now = Date.now() / 1000;
const LABEL = { working: "Working", waiting: "Waiting for you", "your turn": "Your turn", failed: "Failed", ended: "Ended", ready: "Ready", started: "Active" };
const cls = s => s.replace(/\s+/g, "");
const ago = t => { const s = Math.max(0, now - t); return s < 60 ? Math.round(s) + "s" : s < 3600 ? Math.round(s / 60) + "m" : s < 86400 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d"; };
const dur = s => s < 60 ? Math.round(s) + "s" : Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
const base = p => (p || "").replace(/\/+$/, "").split("/").pop() || "(unknown folder)";
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const stale = s => (s.state === "working" || s.state === "waiting") && now - s.last > 600;
function subline(s) {
  if (s.detail) return s.detail;
  const t = s.tasks.length, d = s.tasks.filter(x => x.done).length;
  const running = s.agents.filter(a => a.state === "running").length;
  const parts = [LABEL[s.state] || s.state];
  if (running) parts.push(running + (running === 1 ? " agent running" : " agents running"));
  if (t) parts.push(d + " of " + t + " tasks");
  return parts.join(" · ");
}
const sessions = data.sessions;
const waiting = sessions.filter(s => s.state === "waiting").length, working = sessions.filter(s => s.state === "working").length;
document.getElementById("summary").textContent = sessions.length ? `${waiting} waiting · ${working} working · updated ${ago(data.generated)} ago` : "No sessions yet";
if (waiting) document.title = `(${waiting}) Software factory`;

let selected = decodeURIComponent(location.hash.slice(1)) || (sessions[0] && sessions[0].id);
if (!sessions.some(s => s.id === selected)) selected = sessions[0] && sessions[0].id;

function renderNav() {
  const nav = document.getElementById("nav"); nav.replaceChildren();
  const live = sessions.filter(s => s.state !== "ended"), ended = sessions.filter(s => s.state === "ended");
  for (const [title, list] of [["Active", live], ["Ended", ended]]) {
    if (!list.length) continue;
    nav.append(el("div", { class: "group" }, title));
    for (const s of list) {
      const b = el("button", { class: "item", "aria-current": s.id === selected ? "true" : "false", "data-id": s.id, title: s.cwd },
        el("span", { class: "dot " + cls(s.state) }), el("span", { class: "name" }, base(s.cwd)), el("span", { class: "when" }, ago(s.last)),
        el("span", { class: "sub" }, subline(s) + (stale(s) ? " · quiet 10m+" : "")));
      b.addEventListener("click", () => select(s.id));
      nav.append(b);
    }
  }
}
function rows(items, empty, make) {
  return items.length ? el("div", { class: "list" }, items.map(make)) : el("div", { class: "empty" }, empty);
}
// Which sections and rows are open, kept across the reload every 5 seconds.
const OPEN_KEY = "sf-open";
let opened = {};
try { opened = JSON.parse(sessionStorage.getItem(OPEN_KEY) || "{}") || {}; } catch (e) {}
function remember(key, open) {
  opened[key] = open;
  try { sessionStorage.setItem(OPEN_KEY, JSON.stringify(opened)); } catch (e) {}
}
function disclose(key, cls, byDefault, summary, ...body) {
  const d = el("details", { class: cls });
  d.open = key in opened ? opened[key] : byDefault;
  d.append(summary, ...body);
  d.addEventListener("toggle", () => remember(key, d.open));
  return d;
}
// A row that opens to show its full text and the facts under it.
function row(key, kids, facts) {
  const shown = facts.filter(f => f[1] !== "" && f[1] !== null && f[1] !== undefined);
  return disclose(key, "", false, el("summary", { class: "chev" }, kids), shown.length ? el("dl", { class: "more" }, shown.map(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])) : null);
}
function section(key, title, count, body) {
  return disclose(key, "sec", true, el("summary", {}, el("h3", {}, el("span", { class: "chev" }), title, count !== null ? el("span", { class: "count" }, count) : null)), body);
}
const clock = t => t ? new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
function renderMain() {
  const main = document.getElementById("main"); main.replaceChildren();
  const s = sessions.find(x => x.id === selected);
  if (!s) {
    main.append(el("div", { class: "nothing" }, el("div", {}, el("b", {}, "No sessions recorded yet"),
      "Sessions appear here from their next event after you run /knackpack:software-factory on.")));
    return;
  }
  main.append(el("div", { class: "head" },
    el("div", { class: "row" }, el("h2", {}, base(s.cwd)), el("span", { class: "pill " + cls(s.state) }, LABEL[s.state] || s.state)),
    el("div", { class: "path" }, `${s.cwd} · session ${s.id.slice(0, 8)} · last activity ${ago(s.last)} ago` + (s.beforeTracking ? " · started before tracking" : ""))));
  const c = el("div", { class: "content" });
  if (s.state === "waiting") c.append(el("div", { class: "banner" }, s.detail === "needs your permission" ? "Claude is waiting for your permission." : "Claude is waiting for your reply."));
  if (s.state === "failed") c.append(el("div", { class: "banner failed" }, "The last turn failed" + (s.detail ? ": " + s.detail : ".")));
  const k = s.id + "|";
  const setAll = open => { for (const d of c.querySelectorAll("details")) d.open = open; };
  c.append(el("div", { class: "tools" }, [["Expand all", true], ["Collapse all", false]].map(([label, open]) => {
    const b = el("button", { type: "button" }, label); b.addEventListener("click", () => setAll(open)); return b;
  })));

  const qs = s.questions.map((q, n) => [q, n]).reverse();
  c.append(section(k + "sec:questions", "Questions", qs.length || null, rows(qs, "No questions asked in dialogs yet.", ([q, n]) =>
    row(k + "q:" + n + ":" + q.ts, [el("span", { class: "ic q" }, "?"), el("span", { class: "main clamp" }, q.q), el("span", { class: "meta" }, ago(q.ts)),
      el("span", { class: "note clamp" }, el("span", { class: "answer" }, "→ " + (q.a || "(no answer)")))],
      [["Answer", q.a || "(no answer)"], ["Asked", clock(q.ts)]]))));

  s.records.forEach((r, rn) => {
    const block = el("div", {});
    for (const [name, list, empty] of [["Agreed", r.agreed, "Nothing agreed yet."], ["Assumed, not confirmed", r.assumed, null], ["Open questions", r.open, null]]) {
      if (!list.length && !empty) continue;
      block.append(el("div", { class: "sub2" }, name), rows(list, empty, x => {
        const kids = [el("span", { class: "tag" }, x.id), el("span", { class: "main clamp" }, x.text), el("span", {})];
        return x.more || x.text.length > 140 ? row(k + "r:" + rn + ":" + x.id, kids, [["", x.more]]) : el("div", {}, kids);
      }));
    }
    c.append(section(k + "sec:intent:" + rn, "Intent" + (r.title ? ": " + r.title : ""), null, block));
  });

  const agentRows = s.agents.map((a, n) => [a, n]).reverse();
  const okCount = agentRows.filter(([a]) => a.state === "done").length;
  c.append(section(k + "sec:agents", "Agents", agentRows.length ? `${okCount} of ${agentRows.length} finished` : null, rows(agentRows, "No agents started yet.", ([a, n]) => {
    const ic = a.state === "running" ? el("span", { class: "ic run" }, "●") : a.state === "failed" ? el("span", { class: "ic no" }, "✕") : el("span", { class: "ic ok" }, "✓");
    const name = a.type.startsWith("knackpack:") ? [a.type.slice(10), " ", el("span", { class: "tag" }, "knackpack")] : [a.type];
    const time = a.state === "running" ? "running " + dur(now - a.start) : a.end ? dur(a.end - a.start) : "";
    const notes = [];
    if (a.verdict) notes.push(a.verdict);
    if (a.state === "failed" && a.error) notes.push(a.error);
    if (a.knackpack && a.state === "done" && !a.report) notes.push("Finished without naming a report file.");
    const link = a.report ? el("a", { href: "file://" + encodeURI(a.report) }, "Open report") : null;
    const note = notes.length || link ? el("span", { class: "note clamp" }, notes.join(" · "), link ? [notes.length ? " · " : "", link] : null) : null;
    const report = a.report ? [el("a", { href: "file://" + encodeURI(a.report) }, a.report)] : "";
    return row(k + "a:" + (a.id || n), [ic, el("span", { class: "main" }, name), el("span", { class: "meta" }, time), note],
      [["Verdict", a.verdict], ["Error", a.state === "failed" ? a.error : ""], ["Report", report.length ? report : a.knackpack && a.state === "done" ? "None named" : ""], ["Started", clock(a.start)], ["Finished", a.end ? clock(a.end) : ""], ["Agent ID", a.id]]);
  })));

  const t = s.tasks, d = t.filter(x => x.done).length;
  const tb = el("div", {});
  if (t.length) tb.append(el("div", { class: "bar" }, el("span", { style: `width:${Math.round(100 * d / t.length)}%` })));
  tb.append(rows(t, "No tasks created yet.", x => el("div", { class: x.done ? "done" : "" },
    el("span", { class: "ic " + (x.done ? "ok" : "todo") }, x.done ? "✓" : "○"), el("span", { class: "main" }, x.subject || "(untitled task)"), el("span", {}))));
  c.append(section(k + "sec:tasks", "Tasks", t.length ? `${d} of ${t.length} done` : null, tb));
  main.append(c);
}
function select(id) {
  selected = id; history.replaceState(null, "", "#" + encodeURIComponent(id));
  renderNav(); renderMain();
}
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const order = [...document.querySelectorAll(".item")].map(b => b.dataset.id), i = order.indexOf(selected);
  const next = order[Math.min(order.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)))];
  if (next) { e.preventDefault(); select(next); document.querySelector(`.item[data-id="${next}"]`).focus(); }
});
renderNav(); renderMain();
const scrollKey = "sf-scroll";
const m = document.getElementById("main");
try { const y = Number(sessionStorage.getItem(scrollKey) || 0); if (y) m.scrollTop = y; } catch (e) {}
// Reload from disk every 5 seconds, keeping the selection (in the URL) and
// the scroll position, but not while the page is hidden or text is selected.
setInterval(() => {
  if (document.visibilityState !== "visible" || String(getSelection())) return;
  try { sessionStorage.setItem(scrollKey, String(m.scrollTop)); } catch (e) {}
  location.reload();
}, 5000);
</script>
</body>
</html>
